services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:?Set OPERATOR_TOKEN in .env}
      OPENAI_REALTIME_MODEL: ${OPENAI_REALTIME_MODEL:-gpt-realtime-translate}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      TTS_RATE_LIMIT_MAX: ${TTS_RATE_LIMIT_MAX:-300}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-6-luna}
      MAX_LANGUAGES_PER_EVENT: ${MAX_LANGUAGES_PER_EVENT:-5}
      USAGE_CAP_MINUTES: ${USAGE_CAP_MINUTES:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED: ${OIDC_ALLOWED:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to the exact public origin}
      # Backend is accessible only on the private Compose network.
      FORWARDED_ALLOW_IPS: '*'
      EVENTS_DB_PATH: /data/events.sqlite3
      MAX_LISTENERS: ${MAX_LISTENERS:-30}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-presenter}
      INGEST_INTERNAL_URL: rtmp://ingest:1935
      INGEST_PUBLIC_HOST: ${INGEST_PUBLIC_HOST:-}
      INGEST_RTMP_PORT: ${INGEST_RTMP_PORT:-1935}
      INGEST_SRT_PORT: ${INGEST_SRT_PORT:-8890}
      INGEST_RTMPS_PORT: ${INGEST_RTMPS_PORT:-}
      OPENAI_CASCADE_MODEL: ${OPENAI_CASCADE_MODEL:-}
      SERVER_IDLE_MINUTES: ${SERVER_IDLE_MINUTES:-30}
    volumes:
      - event_data:/data
    expose:
      - '8001'
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
  # Stream ingest: RTMP / SRT (and RTMPS when a certificate is mounted).
  ingest:
    image: bluenviron/mediamtx:1.9.3
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - '${INGEST_RTMP_PORT:-1935}:1935'
      - '${INGEST_SRT_PORT:-8890}:8890/udp'
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # Space-separated origins allowed to embed listener pages, e.g. https://www.cvent.com
      EMBED_ORIGINS: ${EMBED_ORIGINS:-}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  event_data:
  caddy_data:
  caddy_config:
