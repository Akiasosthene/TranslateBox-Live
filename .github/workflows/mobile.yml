name: Mobile apps
on:
  push:
    paths: ['frontend/**', 'mobile/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  TB_SERVER_URL: ${{ vars.TB_SERVER_URL || 'https://translatebox.duckdns.org' }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - name: Build the web app for the native shell
        working-directory: frontend
        run: VITE_BACKEND_URL="$TB_SERVER_URL" npm run build
      - name: Generate and configure the Android project
        working-directory: mobile
        run: |
          npx cap add android
          manifest=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' "$manifest"
          grep -c RECORD_AUDIO "$manifest"
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: translatebox-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - working-directory: frontend
        run: VITE_BACKEND_URL="$TB_SERVER_URL" npm run build
      - name: Generate and configure the iOS project
        working-directory: mobile
        run: |
          npx cap add ios
          plist=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" -c "Add :UIBackgroundModes:0 string audio" "$plist"
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'TranslateBox uses the microphone when you present a session.'" "$plist"
          npx cap sync ios
      - name: Build for the simulator (unsigned check)
        working-directory: mobile/ios/App
        run: |
          if [ -d App.xcworkspace ]; then target="-workspace App.xcworkspace"; else target="-project App.xcodeproj"; fi
          xcodebuild $target -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20
