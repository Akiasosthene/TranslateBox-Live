# Netlify preview of the TranslateBox interface.
# Netlify serves only the frontend; the API and WebSockets stay on your Docker
# server. Set VITE_BACKEND_URL in Netlify (Site settings → Environment
# variables), e.g. https://staging.example.com, and add the Netlify URL to
# CORS_ORIGINS on that server.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
